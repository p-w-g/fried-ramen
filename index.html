<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Fried Ramen</title>
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/img/icons/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/img/icons/favicon-16x16.png"
    />
    <link rel="manifest" href="/manifest.json" />
    <meta
      name="theme-color"
      content="#f5f5f1"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#111513"
      media="(prefers-color-scheme: dark)"
    />
    <script>
      // Before first paint, so a chosen theme never flashes the system one.
      try {
        const theme = localStorage.getItem('theme');
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.dataset.theme = theme;
        }
      } catch {
        // Storage is blocked: follow the system theme.
      }
    </script>
    <meta name="apple-mobile-web-app-title" content="Fried Ramen" />
    <link
      rel="apple-touch-icon"
      href="/img/icons/apple-touch-icon-180x180.png"
    />
  </head>
  <body>
    <noscript>
      <strong
        >We're sorry but no JavaScript no Fried Ramen. Please enable it to
        continue.</strong
      >
    </noscript>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
